<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Live Chat</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 고급 한국어 폰트 Pretendard 불러오기 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* 메인 채팅 카운터 */
        .chat-container {
            width: 100%;
            max-width: 440px;
            height: 85vh;
            max-height: 800px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* 헤더 */
        .header {
            padding: 18px 20px;
            background: #ffffff;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header .title {
            font-weight: 700;
            font-size: 18px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 실시간 상태 표시 점 */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #10b981;
            background: #ecfdf5;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* 닉네임 설정 영역 */
        .nickname-box {
            padding: 12px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nickname-box label {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            white-space: nowrap;
        }

        .nickname-box input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13px;
            background: white;
            color: #334155;
            outline: none;
            transition: all 0.2s ease;
        }

        .nickname-box input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        /* 채팅 박스 */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        /* 커스텀 스크롤바 */
        .chat-box::-webkit-scrollbar {
            width: 5px;
        }
        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* 로딩 바 */
        .loading {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            padding: 8px 0;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        /* 말풍선 애니메이션 & 스타일 */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 78%;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message-wrapper.other {
            align-self: flex-start;
        }

        .message-wrapper.me {
            align-self: flex-end;
        }

        .nickname-tag {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 4px;
            margin-left: 4px;
        }

        .message-wrapper.me .nickname-tag {
            text-align: right;
            margin-right: 4px;
            margin-left: 0;
        }

        .message-bubble {
            padding: 11px 16px;
            font-size: 14px;
            line-height: 1.45;
            word-break: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            transition: transform 0.1s ease;
        }

        /* 남이 보낸 메시지 */
        .message-wrapper.other .message-bubble {
            background: #ffffff;
            color: #1e293b;
            border: 1px solid #f1f5f9;
            border-top-left-radius: 4px;
            border-top-right-radius: 18px;
            border-bottom-right-radius: 18px;
            border-bottom-left-radius: 18px;
        }

        /* 내가 보낸 메시지 */
        .message-wrapper.me .message-bubble {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border-top-left-radius: 18px;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 18px;
            border-bottom-left-radius: 18px;
        }

        /* 입력 창 영역 */
        .input-box {
            padding: 14px 16px;
            background: #ffffff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            background: #f8fafc;
            color: #1e293b;
            transition: all 0.2s ease;
        }

        .input-box input:focus {
            background: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .input-box button {
            width: 42px;
            height: 42px;
            border: none;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
            flex-shrink: 0;
        }

        .input-box button:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 14px rgba(99, 102, 241, 0.4);
        }

        .input-box button:active {
            transform: scale(0.95);
        }

        .input-box button svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            margin-left: 2px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- 헤더 -->
    <div class="header">
        <div class="title">💬 실시간 수다방</div>
        <div class="status-badge">
            <span class="status-dot"></span> LIVE
        </div>
    </div>
    
    <!-- 닉네임 설정 -->
    <div class="nickname-box">
        <label for="nicknameInput">닉네임</label>
        <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요" value="익명" maxlength="12">
    </div>

    <!-- 메시지 리스트 -->
    <div class="chat-box" id="chatBox">
        <div id="loadingMore" class="loading">이전 메시지 불러오는 중...</div>
    </div>

    <!-- 메시지 입력창 -->
    <div class="input-box">
        <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()" aria-label="전송">
            <!-- 종이비행기 SVG 아이콘 -->
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
        </button>
    </div>
</div>

<script>
    // Supabase 설정값 (기존 백엔드 연결 정보 그대로 유지)
    const SUPABASE_URL = 'https://lygjkofnsronuksdfriz.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5Z2prb2Zuc3JvbnVrc2Rmcml6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MTQxMDIsImV4cCI6MjEwNjI5MDEwMn0.nK6Iw4OmFZ5_tlAJaLN1xcZRMfC_MfFJnJUfHr1FJBw';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('messageInput');
    const nicknameInput = document.getElementById('nicknameInput');
    const loadingMore = document.getElementById('loadingMore');

    let isFetching = false;
    let hasMore = true;
    let messageCount = 0;
    const LIMIT = 15;

    // 화면에 메시지 렌더링
    function renderMessage(msg, prepend = false) {
        const isMe = msg.nickname === nicknameInput.value.trim();
        
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${isMe ? 'me' : 'other'}`;
        
        // 과거 메시지 로드 시 애니메이션 지연 방지
        if (prepend) {
            wrapper.style.animation = 'none';
        }

        wrapper.innerHTML = `
            <div class="nickname-tag">${escapeHtml(msg.nickname || '익명')}</div>
            <div class="message-bubble">${escapeHtml(msg.content)}</div>
        `;
        
        if (prepend) {
            chatBox.insertBefore(wrapper, loadingMore.nextSibling);
        } else {
            chatBox.appendChild(wrapper);
        }
    }

    // HTML 이스케이프 (보안 처리)
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }

    // 초기 메시지 로드
    async function loadInitialMessages() {
        const { data, error } = await supabaseClient
            .from('messages')
            .select('*')
            .order('id', { ascending: false })
            .limit(LIMIT);

        if (data) {
            data.reverse().forEach(msg => renderMessage(msg, false));
            messageCount = data.length;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    // 스크롤 상단 도달 시 예전 메시지 로드 (무한 스크롤)
    async function loadMoreMessages() {
        if (isFetching || !hasMore) return;
        isFetching = true;
        loadingMore.style.display = 'block';

        const previousScrollHeight = chatBox.scrollHeight;

        const { data, error } = await supabaseClient
            .from('messages')
            .select('*')
            .order('id', { ascending: false })
            .range(messageCount, messageCount + LIMIT - 1);

        loadingMore.style.display = 'none';

        if (data && data.length > 0) {
            data.forEach(msg => renderMessage(msg, true));
            messageCount += data.length;
            chatBox.scrollTop = chatBox.scrollHeight - previousScrollHeight;
        } else {
            hasMore = false;
        }
        isFetching = false;
    }

    // 스크롤 감지
    chatBox.addEventListener('scroll', () => {
        if (chatBox.scrollTop === 0) {
            loadMoreMessages();
        }
    });

    // 메시지 전송
    async function sendMessage() {
        const content = messageInput.value.trim();
        const nickname = nicknameInput.value.trim() || '익명';

        if (!content) return;

        messageInput.value = '';

        await supabaseClient
            .from('messages')
            .insert([{ nickname: nickname, content: content }]);
    }

    // Realtime 구독
    supabaseClient
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
            renderMessage(payload.new, false);
            chatBox.scrollTop = chatBox.scrollHeight;
            messageCount++;
        })
        .subscribe();

    // 앱 시작
    loadInitialMessages();
</script>

</body>
</html>
